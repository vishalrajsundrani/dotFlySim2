# REFERENCE COPY. NOT READ AT RUN TIME.
#
# tools/compose_sim.py writes the bridge config this simulation actually uses,
# from the sensors the composed model turns out to have, into
# ~/gz_runtime/bridge.yaml. start_sim.sh points ros_gz_bridge at that file.
# Nothing loads this one.
#
# It is kept because it is the readable example of the lazy:true pattern that
# the model SDF and VERSION2_PLAN.md both point at. Editing it changes
# nothing: if a sensor is missing from the running bridge, the fix is in
# compose_sim.py's _TYPES table, which is where six fisheyes were silently
# dropped for being type "wideanglecamera" rather than "camera".

# Simulation clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Cameras: lazy=true — Gazebo renders only while a ROS2 subscriber exists.
# The GUI subscribes for a single frame on demand, then unsubscribes.
- ros_topic_name: "/drone/camera/wide/image_raw"
  gz_topic_name: "/drone/camera/wide/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

