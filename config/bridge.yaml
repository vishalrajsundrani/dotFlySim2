# gz-sim derives the info topic by appending /camera_info to the sensor's
# <topic>, which puts it under a name ending in image_raw; the ROS side is
# renamed to the conventional sibling so that image_raw and camera_info sit
# next to each other and message_filters can pair them. The names differ on
# purpose -- this is not a typo.

- ros_topic_name: "/drone/perception/fl/camera_info"
  gz_topic_name: "/drone/perception/fl/image_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: "/drone/perception/fr/camera_info"
  gz_topic_name: "/drone/perception/fr/image_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
