  lazy: true

- ros_topic_name: "/drone/perception/rl/camera_info"
  gz_topic_name: "/drone/perception/rl/image_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: "/drone/perception/rr/camera_info"
  gz_topic_name: "/drone/perception/rr/image_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: "/drone/perception/dl/camera_info"
