# Drives GstCameraSystem's selective single-stream mode (see server.config):
# whatever gz camera topic camera_switcher.py publishes here becomes the one
# stream sent to QGroundControl on UDP 5600.
- ros_topic_name: "/drone/camera/gst_select"
  gz_topic_name: "/drone/camera/gst_select"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "gz.msgs.StringMsg"
  direction: ROS_TO_GZ

# The six perception fisheyes (models/m4e/model.sdf), mono8 704x704 @ 20 Hz.
#
# Four at the corners, two underneath, SHARED between five sensing directions:
#   FRONT = fl+fr   REAR = rr+rl   LEFT = rl+fl   RIGHT = fr+rr   DOWN = dl+dr
# which sensor is the left EYE of a direction is not its name; see
# config/perception_calib.yaml, generated from the model.
#
# simty routes the chosen pair on to
# /wrapper/psdk_ros2/perception_stereo_{left,right}_stream when start_perception
# is called, exactly as the real wrapper does: one direction at a time.
#
# lazy=true, like the payload lenses: with nobody subscribed Gazebo renders
# nothing, so six fisheyes cost nothing until a perception node asks. That
# matters more here than it did with two: uncompressed these are ~495 kB a
# frame, so all six rendering is ~60 MB/s. Fine over shared memory inside the
# container, NOT fine over a link -- see the datagram note in config/dds.xml.

- ros_topic_name: "/drone/perception/fl/image_raw"
  gz_topic_name: "/drone/perception/fl/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: "/drone/perception/fr/image_raw"
  gz_topic_name: "/drone/perception/fr/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: "/drone/perception/rl/image_raw"
  gz_topic_name: "/drone/perception/rl/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
