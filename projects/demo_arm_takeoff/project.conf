# demo_arm_takeoff — launcher settings
#
# Data, not shell: the launchers READ these keys, they never `source` this file.
# Unknown keys are ignored.

# This project never looks at a picture, so it does not pay for one. Rendering
# the m4e's 14 cameras costs about 1094 megapixels per second and they are
# `always_on`, meaning gz-sim renders them whether anything subscribes or not.
# Turning them off here is the single biggest thing you can do for frame rate.
#   none | payload | fisheye | all
CAMERAS=none
