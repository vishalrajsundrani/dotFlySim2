# =============================================================================
# demo_camera_track — per-project launcher settings
# =============================================================================
#
# Read by ./run.sh (mode 1) and ./demo/run_demo.sh. Optional: a project without
# this file gets the defaults every project got before it existed — the ENU
# velocity setpoint route, no video, no RViz. A project that needs something
# else says so HERE rather than in a branch inside the launchers, which is what
# keeps project discovery filesystem-driven: dropping a directory into demo/ is
# still the whole of "adding a project".
#
# Data, not shell: the launchers READ these keys, they never `source` this file.
# Unknown keys are ignored, so a comment is safe anywhere and a future key is
# harmless in an older checkout.
#
#   SETPOINT      which wrapper control topic project testing mode points at the
#                 simulation: velocity | position | body | rc. DEMO_SETPOINT in
#                 the environment still wins over this.
#   VIDEO_ROUTE   a bridge video route to switch on, sim->host, before the
#                 project starts. Every video route ships DISABLED (an
#                 uncompressed frame is megabytes), so a project that reads one
#                 has to ask.
#   VIDEO_RATE    Hz cap for that route.
#   VIDEO_TOPIC   what the route ends up publishing — the launchers check that
#                 frames actually arrive there, and say so when they do not.
#   CAMERA_LENS   which simulated lens to make active: wide | medium_tele | tele
#   CAMERA_MODE   which resolution tier: photo | video_4k | video_fhd | preview.
#                 preview is 640x360 (~0.7 MB a frame) against photo's ~60 MB —
#                 not a nicety, the difference between a feed and a stall.
#   RVIZ          RViz config for `--rviz`, relative to this directory.
# =============================================================================

# The camera is bolted to the airframe, so everything it measures is body
# relative: this demo steers on flight_control_setpoint_FLUvelocity_yawrate.
SETPOINT=body

# The simulated active lens, out to the wrapper's own main_camera_stream — the
# picture a PSDK payload application would get.
VIDEO_ROUTE=main_camera_out
VIDEO_RATE=10
VIDEO_TOPIC=main_camera_stream
CAMERA_LENS=wide
CAMERA_MODE=preview

RVIZ=rviz/camera_track.rviz

# This project is the one that genuinely needs the gimbal lenses. The two
# perception cameras are not used here, so they stay off.
#   none | payload | fisheye | all
CAMERAS=payload
