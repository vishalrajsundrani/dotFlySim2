# demo_orbit_mission — launcher settings
#
# Data, not shell: the launchers READ these keys, they never `source` this file.

# Flies a circle on velocity setpoints and never looks at a picture, so no
# cameras are rendered. See demo_arm_takeoff/demo.conf for what that saves.
#   none | payload | fisheye | all
CAMERAS=none

# ENU (ground-frame) velocity is the default the bridge uses anyway; stated
# here so the choice is visible next to the code that depends on it.
SETPOINT=velocity
